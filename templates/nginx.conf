# License: MIT
# ==============================================================================

user  nginx;
worker_processes  auto; # Automatically scale threads to match bare-metal compute cores
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024; # Handle high concurrent traffic pipelines smoothly
    use epoll; # Leverage optimized Linux kernel event notification mechanism
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # High-Performance Logging Config
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Bare-Metal Kernel Disk I/O Optimization
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off; # Hide Nginx version numbers to prevent corporate reconnaissance exploits

    # Universal Gzip Compression for Faster Page Load Times
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --------------------------------------------------------------------------
    # 1. Global HTTP Rule: Enforce 100% Secure HTTPS Redirects
    # --------------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _; # Catch all inbound domain requests

        # Allow ACME Certbot standalone checks to bypass HTTPS redirects smoothly
        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. Main HTTPS Server Block (The Production Gateway)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name squarespace-overhaul-ref.com; # Dynamically swapped by AGI engine

        # Cryptographic Layer: Modern Let's Encrypt Certificate Paths
        ssl_certificate /etc/letsencrypt/live/://example.com;
        ssl_certificate_key /etc/letsencrypt/live/://example.com;

        # Strict SSL Hardening Parameters (Mozilla Modern Profile Specs)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # SSL Cache Tuning for Microsecond Handshake Execution
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Mandatory Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ----------------------------------------------------------------------
        # 3. Dynamic Application Reverse Proxy Routing
        # ----------------------------------------------------------------------
        location / {
            # Proxy Network Configurations
            proxy_pass http://slam-core-engine:8080; # Points directly to internal container network
            proxy_redirect off;
            
            # Pass Authentic Client Headers to the Application Layer
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # High-Throughput Web Socket Buffering Handshakes
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Uncap Response/Request Timeout Boundaries
            proxy_connect_timeout 90;
            proxy_send_timeout 90;
            proxy_read_timeout 90;
            client_max_body_size 100m; # Comfortably allow user media/image uploads
        }
    }
}
