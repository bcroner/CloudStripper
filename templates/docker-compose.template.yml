version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Edge Gateway Tier: High-Performance SSL Proxy & Traffic Router
  # ----------------------------------------------------------------------------
  web-gateway:
    image: nginx:alpine
    container_name: gc_gateway_${CUSTOMER_ID}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      # Inject the compiled AGI Nginx configuration template dynamically
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount the cryptographic assets generated by security_init.sh
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
    networks:
      - infrastructure_isolated_net
    depends_on:
      - target-application

  # ----------------------------------------------------------------------------
  # 2. Application Tier: The Customer's Isolated Compute Node (e.g., SLAM / WordPress)
  # ----------------------------------------------------------------------------
  target-application:
    image: ${APP_IMAGE_PATH}:${APP_IMAGE_TAG}
    container_name: gc_app_${CUSTOMER_ID}
    restart: ${RESTART_POLICY}
    expose:
      - "${INTERNAL_APP_PORT}"
    environment:
      - CUSTOMER_ID=${CUSTOMER_ID}
      - ENVIRONMENT=production
      - CORE_MAX_WINDOW_SIZE=${MAX_WINDOW_SIZE:-255}
      - SYSTEM_THREAD_COUNT=${THREAD_COUNT:-auto}
    volumes:
      # Persistent local storage mount for content, uploads, or caching databases
      - app_persistent_data:/usr/src/app/data
    networks:
      - infrastructure_isolated_net

# ------------------------------------------------------------------------------
# Infrastructure Storage and Network Resource Isolation Gates
# ------------------------------------------------------------------------------
volumes:
  # Guarantees the customer's data persists natively on bare-metal even if the container updates
  app_persistent_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PERSISTENT_DATA_PATH}

networks:
  # Enforces a private virtual bridge network so backend apps remain unexposed to the public web
  infrastructure_isolated_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br_stripper_${CUSTOMER_ID}
